[project]
name = "calmora"
version = "0.1.0"
description = "Calmora - Mental Health Management Platform"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.1",
    "Flask-Migrate==4.0.7",
    "WTForms==3.1.2",
    "email-validator==2.1.1",
    "python-dotenv==1.0.1",
    "openpyxl==3.1.2",
    "reportlab==4.2.2",
    "Werkzeug==3.0.3",
    "psycopg2-binary==2.9.9",
]

[tool.vercel]
entrypoint = "run:app"